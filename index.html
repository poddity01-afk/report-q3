  c.secs=function(){ return Math.floor((c.acc+(c.run?Date.now()-c.t0:0))/1000); };
  c.start=function(){ if(c.run) return; c.t0=Date.now(); c.run=true; c.tk=setInterval(onTick,250); };
  c.hold=function(){ if(!c.run) return; c.acc+=Date.now()-c.t0; c.run=false; if(c.tk){ clearInterval(c.tk); c.tk=null; } };
  c.reset=function(){ c.hold(); c.acc=0; };
  c.add=function(sec){ c.acc+=sec*1000; };
  return c;
}

function colName(n){ var s=""; n++; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function A1(r,c){ return colName(c)+(r+1); }
function dur(s){ return s<60 ? s+"초" : Math.floor(s/60)+"분 "+(s%60)+"초"; }
function clock(s){ return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
function today(){ var d=new Date(); return ("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hash(s){ var h=5381,i; for(i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function isGame(){ return cur.charAt(0)==="g"; }
function isApple(){ return cur==="ap"; }
function ai(r,c){ if(!isApple()) return -1; var y=r-B_R, x=c-B_C; return (y>=0&&y<AP_R&&x>=0&&x<AP_C) ? y*AP_C+x : -1; }
function isVal(){ return cur==="val"; }
function isHeat(){ return cur==="heat"; }
function vi(r,c){ if(!isVal()) return null; var y=r-B_R, x=c-1; return (y>=0&&y<VL_ROWS&&x>=0&&x<10) ? {y:y,x:x} : null; }
function hi(r,c){ if(!isHeat()) return -1; var y=r-B_R, x=c-B_C; return (y>=0&&y<HT_R&&x>=0&&x<HT_C) ? y*HT_C+x : -1; }

/* ── 게임판 좌표 ↔ 시트 좌표 ── */
function gi(r,c){ if(!isGame()) return -1; var y=r-B_R, x=c-B_C; return (y>=0&&y<R&&x>=0&&x<C) ? y*C+x : -1; }
function nbrs(i){
  var x=i%C, y=Math.floor(i/C), out=[], dx, dy, nx, ny;
  for(dy=-1;dy<=1;dy++) for(dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    nx=x+dx; ny=y+dy;
    if(nx>=0&&nx<C&&ny>=0&&ny<R) out.push(ny*C+nx);
  }
  return out;
}
function rangeOf(i){
  var x=i%C, y=Math.floor(i/C);
  var x0=Math.max(0,x-1), x1=Math.min(C-1,x+1), y0=Math.max(0,y-1), y1=Math.min(R-1,y+1);
  return A1(B_R+y0,B_C+x0)+":"+A1(B_R+y1,B_C+x1);
}

function localRecs(){ try{ var v=JSON.parse(localStorage.getItem("xl.recs")||"[]"); return v instanceof Array?v:[]; }catch(e){ return []; } }
function allRecs(){
  var arr=localRecs(), i, k, byKey={};
  for(i=0;i<arr.length;i++) byKey[arr[i].key]=arr[i];
  for(k in cloud){ var c=cloud[k]; if(c&&typeof c.name==="string"&&typeof c.secs==="number"&&!byKey[k]) byKey[k]={key:k,name:String(c.name).slice(0,12),lv:+c.lv,secs:c.secs,at:String(c.at||"").slice(0,5)}; }
  var out=[]; for(k in byKey) out.push(byKey[k]);
  return out;
}
function mergeRec(r){
  if(!r) return false;
  var name=String(r.name||"").replace(/\s+/g," ").trim().slice(0,12), g=+r.lv, t=+r.secs;
  if(!name||!(g>=0&&g<=5)||!(t>0&&t<200000)) return false;
  var rec={key:r.key||(g+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)), name:name, lv:g, secs:Math.round(t), at:String(r.at||today()).slice(0,5)};
  var arr=localRecs(), i;
  for(i=0;i<arr.length;i++){ var o=arr[i]; if(o.key===rec.key||(o.name===rec.name&&o.lv===rec.lv&&o.secs===rec.secs&&o.at===rec.at)) return false; }
  arr.push(rec);
  try{ localStorage.setItem("xl.recs",JSON.stringify(arr.slice(-300))); }catch(e){}
  r.key=rec.key;
  return true;
}
function b64e(s){ var b=new TextEncoder().encode(s), t="", i; for(i=0;i<b.length;i++) t+=String.fromCharCode(b[i]); return btoa(t).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_"); }
function b64d(s){ var t=atob(s.replace(/-/g,"+").replace(/_/g,"/")), b=new Uint8Array(t.length), i; for(i=0;i<t.length;i++) b[i]=t.charCodeAt(i); return new TextDecoder().decode(b); }
function pack(list){ return "XL1"+b64e(JSON.stringify(list.map(function(r){ return [r.name,r.lv,r.secs,r.at]; }))); }
function takeCode(s){
  s=String(s).replace(/\s+/g,""); if(s.indexOf("XL1")!==0) return -1;
  var rows; try{ rows=JSON.parse(b64d(s.slice(3))); }catch(e){ return -1; }
  if(!(rows instanceof Array)) return -1;
  var n=0,i; for(i=0;i<rows.length;i++){ var r=rows[i]; if(r instanceof Array&&mergeRec({name:r[0],lv:r[1],secs:r[2],at:r[3]})) n++; }
  return n;
}

function secs(){ return Math.floor((acc+(running?Date.now()-t0:0))/1000); }
function runClock(){ if(running||over||!live) return; t0=Date.now(); running=true; tick=setInterval(info,500); }
function holdClock(){ if(!running) return; acc+=Date.now()-t0; running=false; if(tick){ clearInterval(tick); tick=null; } }
function zeroClock(){ holdClock(); acc=0; }
function info(){
  if(!infoEl||!isGame()) return;
  if(over&&opened===C*R-M){ infoEl.className="x score"; infoEl.textContent="완료 · "+clock(secs()); return; }
  infoEl.className="x info r"+(over?" urgent":"");
  infoEl.textContent=(over?"#REF! · 경과 ":"오류 "+(M-marks)+"건 · 경과 ")+clock(secs());
}

/* ═══════════════════════════════════════════════════════
   게임 로직
   ═══════════════════════════════════════════════════════ */
function newBoard(){
  var S=GRADE[lv], i;
  C=S.c; R=S.r; M=S.m;
  cells=[]; opened=0; marks=0; live=false; over=false; looks=3; note=null; pending=null;
  zeroClock();
  for(i=0;i<C*R;i++) cells.push({mine:false,adj:0,open:false,mark:false});
}
function seed(safe){
  var pool=[], skip={}, s=nbrs(safe).concat([safe]), i, j, t, n, k, q;
  for(i=0;i<s.length;i++) skip[s[i]]=1;
  for(i=0;i<C*R;i++) if(!skip[i]) pool.push(i);
  for(i=pool.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  for(i=0;i<M&&i<pool.length;i++) cells[pool[i]].mine=true;
  for(i=0;i<C*R;i++){ n=nbrs(i); k=0; for(q=0;q<n.length;q++) if(cells[n[q]].mine) k++; cells[i].adj=k; }
}
function paint(i){
  var c=cells[i], d=nodes[i]; if(!d) return;
  var cl="x tl";
  d.removeAttribute("data-n"); d.textContent="";
  if(c.open){ cl+=" open r"; if(c.adj){ d.textContent=c.adj; d.setAttribute("data-n",c.adj); } else { cl+=" zero"; d.textContent="-"; } }
  else if(c.mark){ cl+=" mark"; d.textContent="검토"; }
  if(d.classList.contains("sel")) cl+=" sel";
  d.className=cl;
}
function open(i){
  if(over||!isGame()) return;
  var c=cells[i]; if(c.mark||c.open) return;
  if(!live){ seed(i); live=true; runClock(); }
  note=null;
  if(cells[i].mine){ boom(i); return; }
  var stack=[i], seen={}, k, cc, n, q;
  while(stack.length){
    k=stack.pop(); if(seen[k]) continue; seen[k]=1; cc=cells[k];
    if(cc.open||cc.mark||cc.mine) continue;
    cc.open=true; opened++; paint(k);
    if(cc.adj===0){ n=nbrs(k); for(q=0;q<n.length;q++) stack.push(n[q]); }
  }
  stats();
  if(opened===C*R-M) win();
}
function mark(i){
  if(over||cells[i].open) return;
  cells[i].mark=!cells[i].mark; marks+=cells[i].mark?1:-1;
  note=null; paint(i); info(); stats();
}
function chord(i){
  var c=cells[i]; if(over||!c.open||!c.adj) return;
  var n=nbrs(i), f=0, q;
  for(q=0;q<n.length;q++) if(cells[n[q]].mark) f++;
  if(f!==c.adj) return;
  for(q=0;q<n.length;q++) if(!cells[n[q]].mark&&!cells[n[q]].open) open(n[q]);
}
function look(){
  if(over||!isGame()) return;
  if(!live){ say('먼저 셀을 하나 계산해 주세요.'); return; }
  if(looks<=0){ say('참조 검사 횟수를 모두 사용했습니다.'); return; }
  var p=[], i; for(i=0;i<cells.length;i++) if(!cells[i].open&&!cells[i].mine&&!cells[i].mark) p.push(i);
  if(!p.length) return;
  var t=p[Math.floor(Math.random()*p.length)]; looks--;
  setSel(B_R+Math.floor(t/C), B_C+t%C);
  nodes[t].classList.add("look"); setTimeout(function(){ if(nodes[t]) nodes[t].classList.remove("look"); },2000);
  say(A1(B_R+Math.floor(t/C),B_C+t%C)+' 셀은 참조 오류가 없습니다. (남은 검사 '+looks+'회)');
}
function boom(i){
  over=true; holdClock(); cells[i].open=true;
  var k;
  for(k=0;k<cells.length;k++){
    if(!nodes[k]) continue;
    if(k===i){ nodes[k].className="x tl boom"; nodes[k].textContent="#REF!"; }
    else if(cells[k].mine&&!cells[k].mark){ nodes[k].className="x tl na"; nodes[k].textContent="#N/A"; }
    else if(!cells[k].mine&&cells[k].mark){ nodes[k].className="x tl bad"; nodes[k].textContent="#VALUE!"; }
  }
  setSel(B_R+Math.floor(i/C), B_C+i%C);
  info(); stats();
  $("mode").textContent="계산 오류";
  say('<b>#REF!</b> 잘못된 참조 — '+A1(B_R+Math.floor(i/C),B_C+i%C)+' 에서 지뢰를 밟았어요. ‘다시 계산’(R)을 눌러주세요.');
}
function win(){
  over=true; holdClock();
  var t=secs(), k;
  for(k=0;k<cells.length;k++) if(cells[k].mine&&!cells[k].mark){ cells[k].mark=true; paint(k); }
  marks=M; info(); stats();
  $("mode").textContent="준비";
  askName(lv, t, '<b class="ok">계산 완료</b> '+ROLES[role].sheets[lv]+' '+dur(t));
}
/* 두 게임이 공유하는 기록 입력줄. secs 는 "작을수록 좋은 값" — 잔량 정리는 100000-점수 로 넣는다 */
function askName(g, val, label){
  pendLv=g; pending=val;
  note=label+' <span class="dim">— 담당자명을 입력하면 실적에 반영됩니다.</span> <input id="nameIn" maxlength="12" placeholder="담당자명" value="'+esc(myName)+'">';
  fline.innerHTML=note;
  var el=$("nameIn"); if(el){ el.focus(); el.select(); }
}
function recLabel(g,secs){ return g===3 ? (100000-secs)+"개" : dur(secs); }
function commit(){
  var el=$("nameIn"); if(!el||pending===null) return;
  var nm=el.value.replace(/\s+/g," ").trim().slice(0,12);
  if(!nm){ el.focus(); return; }
  myName=nm; try{ localStorage.setItem("xl.name",nm); }catch(e){}
  var t=pending, g=pendLv; pending=null;
  var rec={name:nm,lv:g,secs:t,at:today()}; mergeRec(rec); myKey=rec.key;
  cloudPush(rec);
  go("sum");
  if(cloudOn) say('<b class="ok">반영 완료</b> '+esc(nm)+' · '+recLabel(g,t)+' <span class="dim">실적이 공유 집계에 추가되었습니다.</span>');
  else showCode(pack([rec]), nm+" "+recLabel(g,t));
}

function apNew(){

function apSecs(){ return Math.floor((apAcc+(apRun?Date.now()-apT0:0))/1000); }
function apLeft(){ return Math.max(0,AP_TIME-apSecs()); }
function apRunClock(){ if(apRun||apOver||!apLive) return; apT0=Date.now(); apRun=true; apTick=setInterval(apInfo,250); }
function apHold(){ if(!apRun) return; apAcc+=Date.now()-apT0; apRun=false; if(apTick){ clearInterval(apTick); apTick=null; } }
function apInfo(){
  if(!isApple()) return;
  var left=apLeft();

    if(apOver){ infoEl.className="x score"; infoEl.textContent="총 "+apScore+"개 정리 완료"; }

  }

function apPaint(i){

function apRect(){
  if(!drag) return null;
  return {r0:Math.min(drag.r0,drag.r1), r1:Math.max(drag.r0,drag.r1), c0:Math.min(drag.c0,drag.c1), c1:Math.max(drag.c0,drag.c1)};
}
function apClearRng(){ for(var k=0;k<rng.length;k++) rng[k].classList.remove("rng"); rng=[]; }
function apShowRng(){
  apClearRng();
  var q=apRect(); if(!q) return;
  var r,c,n=0,s=0;
  for(r=q.r0;r<=q.r1;r++) for(c=q.c0;c<=q.c1;c++){
    var el=cellAt(r,c); if(el){ el.classList.add("rng"); rng.push(el); }

  }
  $("cnt").textContent=n; $("sum").textContent=s; $("avg").textContent=n?(s/n).toFixed(1):"-";
  fline.textContent="=SUM("+A1(q.r0,q.c0)+":"+A1(q.r1,q.c1)+")";

function apDrop(){
  var q=apRect(); drag=null;
  if(!q){ apClearRng(); return; }
  var r,c,s=0,hit=[];
  for(r=q.r0;r<=q.r1;r++) for(c=q.c0;c<=q.c1;c++){ var i=ai(r,c); if(i>=0&&ap[i]){ s+=ap[i]; hit.push(i); } }
  apClearRng();
  if(s===10&&hit.length&&!apOver){
    apScore+=hit.length;
    hit.forEach(function(i){ ap[i]=0; apPaint(i); apNodes[i].classList.add("good"); });
    setTimeout(function(){ hit.forEach(function(i){ if(apNodes[i]) apNodes[i].classList.remove("good"); }); },220);

  function row(){ var r; do{ r=Math.floor(Math.random()*VL_ROWS); }while(used[r]); used[r]=1; return r; }
  var types=["date","code","name","status","neg","rel","dup","vendor"], t;
  for(i=types.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); t=types[i]; types[i]=types[j]; types[j]=t; }

/* ═══════════════════════════════════════════════════════

var SHAPES=[
  ["하트",[".#.#.","#####","#####",".###.","..#.."]],
  ["별",["..#..",".###.","#####",".###.","#.#.#"]],
  ["화살표",["..#..","..##.","#####","..##.","..#.."]],
  ["십자",["..#..","..#..","#####","..#..","..#.."]],
  ["마름모",["..#..",".###.","#####",".###.","..#.."]],
  ["사각 고리",["####","#..#","#..#","####"]],
  ["체크",["....#","...#.","#.#..",".#..."]],
  ["번개",["..##",".##.","####","..#.",".#.."]],
  ["집",["..#..",".###.","#####",".#.#.",".###."]],
  ["계단",["#...","##..","###.","####"]]

function htNew(){
  var n=HT_C*HT_R, i, vals=[], owner=[], shapes=[], pool=SHAPES.slice(), tries=0;
  for(i=0;i<n;i++){ var u=Math.random(); vals.push(28+Math.floor(u*u*36)); owner.push(-1); }
  while(shapes.length<HT_N&&pool.length&&tries<400){
    tries++;
    var si=Math.floor(Math.random()*pool.length), sh=pool[si], m=sh[1], h=m.length, w=m[0].length;
    var oy=1+Math.floor(Math.random()*(HT_R-h-2)), ox=1+Math.floor(Math.random()*(HT_C-w-2)), ok=true, y, x, cells=[];
    for(y=-1;y<=h&&ok;y++) for(x=-1;x<=w;x++){ var yy=oy+y, xx=ox+x; if(yy<0||yy>=HT_R||xx<0||xx>=HT_C) continue; if(owner[yy*HT_C+xx]>=0){ ok=false; break; } }
    if(!ok) continue;
    for(y=0;y<h;y++) for(x=0;x<w;x++) if(m[y].charAt(x)==="#"){ var k=(oy+y)*HT_C+ox+x; owner[k]=shapes.length; vals[k]=64+Math.floor(Math.random()*9); cells.push(k); }
    shapes.push({name:sh[0],cells:cells,found:false}); pool.splice(si,1);
  }
  ht.vals=vals; ht.owner=owner; ht.shapes=shapes; ht.found=0; ht.live=false; ht.over=false; ht.hints=3; note=null; pending=null;
  if(ht.clock) ht.clock.reset(); else ht.clock=Clock(htInfo);
}
function heatColor(v){ /* Excel 3색 색조: 초록(0) → 노랑(50) → 빨강(100) */
  var a,b,t; if(v<50){ a=[99,190,123]; b=[255,235,132]; t=v/50; } else { a=[255,235,132]; b=[248,105,107]; t=(v-50)/50; }
  return "rgb("+Math.round(a[0]+(b[0]-a[0])*t)+","+Math.round(a[1]+(b[1]-a[1])*t)+","+Math.round(a[2]+(b[2]-a[2])*t)+")";
}
function htInfo(){

    put(1,1,R0.apTitle,"big spill");
    put(1,B_C+AP_C-5,"","info r",{info:true,span:5});

    put(1,1,R0.sTitle,"big spill");
    put(2,1,"집계 기준: 최근 처리분  ·  단위: 건  ·  작성: "+R0.who+"  ·  담당 "+Object.keys(who).length+"명  ·  "+(cloudOn?"실시간 집계":"행 선택 시 참조 코드 복사"),"dim spill");

  }
  if(isApple()){
    for(i=0;i<AP_C*AP_R;i++) apNodes.push(cellAt(B_R+Math.floor(i/AP_C),B_C+i%AP_C));
    infoEl=cellAt(1,B_C+AP_C-5);
    apInfo();
  }
  // 커서: 시트에 맞는 자연스러운 위치
  if(isGame()) { if(gi(sel.r,sel.c)<0) sel={r:B_R,c:B_C}; }
  else if(isApple()) { if(ai(sel.r,sel.c)<0) sel={r:B_R,c:B_C}; }
  else if(isVal()) { if(!vi(sel.r,sel.c)) sel={r:B_R,c:1}; }
  else if(isHeat()) { if(hi(sel.r,sel.c)<0) sel={r:B_R,c:B_C}; }
  else if(cur==="raw") { if(sel.r<1||sel.r>60) sel={r:12,c:7}; }
  else { sel={r:ct.hasTot?ct.sumRow:5, c:ct.hasTot?5:2}; }
  setSel(sel.r,sel.c);
  tabs(); stats();
}
function cellAt(r,c){ return grid.children[(r+1)*(ncols+1)+(c+1)]||null; }

function setSel(r,c){
  r=Math.max(0,Math.min(nrows-1,r)); c=Math.max(0,Math.min(ncols-1,c));
  var old=cellAt(sel.r,sel.c); if(old) old.classList.remove("sel");
  if(hdrC[sel.c]) hdrC[sel.c].classList.remove("hot");
  if(hdrR[sel.r]) hdrR[sel.r].classList.remove("hot");
  sel={r:r,c:c};
  var el=cellAt(r,c); if(el){ el.classList.add("sel"); scrollIntoView(el); }
  if(hdrC[c]) hdrC[c].classList.add("hot");
  if(hdrR[r]) hdrR[r].classList.add("hot");
  nbox.value=A1(r,c);
  formula();
}
function scrollIntoView(el){
  var top=el.offsetTop, left=el.offsetLeft, h=el.offsetHeight, w=el.offsetWidth;
  if(top-21<sw.scrollTop) sw.scrollTop=top-21;
  else if(top+h>sw.scrollTop+sw.clientHeight) sw.scrollTop=top+h-sw.clientHeight;
  if(left-46<sw.scrollLeft) sw.scrollLeft=left-46;
  else if(left+w>sw.scrollLeft+sw.clientWidth) sw.scrollLeft=left+w-sw.clientWidth;
}
function formula(){
  if(note!==null){ fline.innerHTML=note; return; }
  var el=cellAt(sel.r,sel.c), t=el?el.textContent:"";
  if(isGame()){
    var i=gi(sel.r,sel.c);
    if(i>=0){
      var c=cells[i];
      if(!live){ fline.innerHTML='<span class="dim">'+TIP+'</span>'; return; }
      if(over&&c.mine&&c.open) fline.textContent="=NA()";
      else if(c.open) fline.textContent='=COUNTIF('+rangeOf(i)+',"#N/A")';
      else if(c.mark) fline.textContent='=IF(ISERROR('+A1(sel.r,sel.c)+'),"검토","")';
      else fline.textContent="";
      return;
    }
    if(el&&el.dataset.info) { fline.textContent='="오류 "&'+A1(1,1)+'&"건 · 경과 "&TEXT(NOW()-$A$1,"m:ss")'; return; }
    fline.textContent=t; return;
  }
  if(isApple()){
    if(drag) return;
    var k=ai(sel.r,sel.c);
    if(k>=0){ if(!apLive) fline.innerHTML='<span class="dim">잔량 합이 10이 되는 구역을 드래그로 범위 선택하세요. 상태 표시줄의 합계를 보면서.</span>'; else fline.textContent=t; return; }
    if(el&&el.dataset.info){ fline.textContent='="남은 "&TEXT($A$1-NOW(),"m:ss")&" · 정리 "&COUNTBLANK(C5:S14)&"개"'; return; }
    fline.textContent=t; return;
  }
  if(isVal()){
    var pv=vi(sel.r,sel.c);
    if(pv&&!vl.live) { fline.innerHTML='<span class="dim">오류가 있는 셀을 찾아 클릭하세요. 날짜·코드·이름·상태·수량·금액·중복·거래처 순으로 살펴보면 빠릅니다.</span>'; return; }
    fline.textContent=t; return;
  }
  if(isHeat()){
    var ph=hi(sel.r,sel.c);
    if(ph>=0&&!ht.live) { fline.innerHTML='<span class="dim">색조 서식에서 주변과 결이 다른 패턴을 찾아 클릭하세요. 상태 표시줄 평균과 비교하면 도움이 됩니다.</span>'; return; }
    if(ph>=0){ fline.textContent="=ROUND(원본데이터!H"+(sel.r+1)+"/AVERAGE(원본데이터!H:H)*50,0)"; return; }
    fline.textContent=t; return;
  }
  if(cur==="raw"){
    var r=sel.r, c2=sel.c;
    if(r>=1&&r<=60){
      if(role===1&&c2===7) { fline.textContent="=F"+(r+1)+"*G"+(r+1); return; }
      if(role===2&&c2===7&&r>1) { fline.textContent="=H"+r+"+F"+(r+1)+"-G"+(r+1); return; }
      if(role===0&&c2===7) { fline.textContent="=ROUND(G"+(r+1)+"*VLOOKUP(I"+(r+1)+",운임표!$A$2:$B$5,2,0),-2)"; return; }
    }
    fline.textContent=t; return;
  }
  if(el&&el.dataset.all){ fline.textContent="=SUM(E6:E"+sel.r+")"; return; }
  fline.textContent=t;
}
function stats(){
  var n=0,s=0,i;
  if(isGame()){ for(i=0;i<cells.length;i++) if(cells[i].open){ n++; s+=cells[i].adj; } $("avg").textContent=n?(s/n).toFixed(1):"-"; $("cnt").textContent=n; $("sum").textContent=s; }
  else if(isApple()){ if(drag) return; for(i=0;i<ap.length;i++) if(ap[i]){ n++; s+=ap[i]; } $("avg").textContent=n?(s/n).toFixed(1):"-"; $("cnt").textContent=n; $("sum").textContent=s; }
  else if(isVal()){ $("avg").textContent="-"; $("cnt").textContent=String(VL_ROWS*10); $("sum").textContent="-"; }
  else if(isHeat()){ for(i=0;i<ht.vals.length;i++){ n++; s+=ht.vals[i]; } $("avg").textContent=n?(s/n).toFixed(1):"-"; $("cnt").textContent=n; $("sum").textContent=comma(s); }
  else if(cur==="raw"){ $("avg").textContent="-"; $("cnt").textContent="60"; $("sum").textContent="-"; }
  else { var list=allRecs(), m=0; for(i=0;i<list.length;i++) if(list[i].lv!==3){ m++; s+=list[i].secs; } $("avg").textContent=m?dur(Math.round(s/m)):"-"; $("cnt").textContent=list.length; $("sum").textContent=dur(s); }
}

/* ═══════════════════════════════════════════════════════
   시트 전환 · 탭 · 부서
   ═══════════════════════════════════════════════════════ */
function go(id){
  if(id===cur) return;
  if(isGame()) holdClock();
  if(isApple()) apHold();
  if(isVal()&&vl.clock) vl.clock.hold();
  if(isHeat()&&ht.clock) ht.clock.hold();
  prev=cur; cur=id;
  note=null;
  if(isGame()){
    var n=+id.charAt(1);
    if(n!==lv||!cells.length){ lv=n; newBoard(); }
  }
  render();
  if(isGame()&&live&&!over) runClock();
  if(isApple()&&apLive&&!apOver) apRunClock();
  if(isVal()&&vl.live&&!vl.over) vl.clock.start();
  if(isHeat()&&ht.live&&!ht.over) ht.clock.start();
  sw.focus();
}
function tabs(){
  var R0=ROLES[role], h="";
  function t(id,label){ return '<button class="stab'+(cur===id?" on":"")+'" data-go="'+id+'">'+label+'</button>'; }
  h+=t("sum",R0.sum);
  for(var i=0;i<3;i++) h+=t("g"+i,R0.sheets[i]);
  h+=t("ap",R0.ap);
  h+=t("val",R0.val);
  h+=t("heat",R0.heat);
  h+=t("raw",R0.raw);
  $("tabs").innerHTML=h;
}
function setRole(n){
  role=n;
  var R0=ROLES[role];
  $("wtitle").textContent=R0.file; document.title=R0.file+" - Excel";
  $("roleLbl").textContent="부서: "+R0.key;
  Array.prototype.forEach.call($("roleMenu").children,function(b){ var on=+b.dataset.role===role; b.classList.toggle("on",on); b.firstChild.textContent=on?"✓":""; });
  render();
}

/* ═══════════════════════════════════════════════════════
   입력
   ═══════════════════════════════════════════════════════ */
function target(e){ var el=e.target.closest(".x"); if(!el) return null; return {el:el, r:+el.dataset.r, c:+el.dataset.c}; }

grid.addEventListener("mousedown",function(e){
  var t=target(e); if(!t) return;
  if(e.button!==0&&e.button!==1&&e.button!==2) return;
  setSel(t.r,t.c);
  var i=gi(t.r,t.c);
  if(i>=0){
    /* 좌+우 동시(e.buttons===3) 또는 휠 클릭 = 코드: 숫자 주변을 한 번에 연다 */
    if(e.buttons===3||e.button===1){ e.preventDefault(); chord(i); formula(); return; }
    if(e.button===2){ e.preventDefault(); mark(i); }
    else if(markMode) mark(i);
    else if(cells[i].open) chord(i);
    else open(i);
    formula();
    return;
  }
  if(e.button!==0) return;
  var pv=vi(t.r,t.c); if(pv){ vlClick(pv.y,pv.x); return; }
  var ph=hi(t.r,t.c); if(ph>=0){ htClick(ph); return; }
  var k=ai(t.r,t.c);
  if(k>=0){
    e.preventDefault();
    if(apOver||pending!==null) return;
    if(!apLive){ apLive=true; apRunClock(); }
    drag={r0:t.r,c0:t.c,r1:t.r,c1:t.c};
    apShowRng();
    return;
  }
  if(t.el.dataset.all==="1"){ showCode(pack(allRecs()),"전체 집계"); return; }
  if(t.el.dataset.ri!==undefined){ var rec=shown[+t.el.dataset.ri]; if(rec) showCode(pack([rec]), rec.name+" "+recLabel(rec.lv,rec.secs)); }
});
/* 잔량 정리: 드래그로 범위를 넓히고, 놓는 순간 합계를 판정한다 */
grid.addEventListener("mousemove",function(e){
  if(!drag) return;
  var t=target(e); if(!t) return;
  var r=Math.max(B_R,Math.min(B_R+AP_R-1,t.r)), c=Math.max(B_C,Math.min(B_C+AP_C-1,t.c));
  if(r===drag.r1&&c===drag.c1) return;
  drag.r1=r; drag.c1=c; apShowRng();
});
document.addEventListener("mouseup",function(){ if(drag) apDrop(); });
grid.addEventListener("dblclick",function(e){ var t=target(e); if(!t) return; var i=gi(t.r,t.c); if(i>=0){ chord(i); formula(); } });
sw.addEventListener("contextmenu",function(e){ e.preventDefault(); });
fline.addEventListener("keydown",function(e){ if(e.target.id==="nameIn"&&e.key==="Enter"){ e.preventDefault(); commit(); } });

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    e.preventDefault();
    if(!$("roleMenu").hidden){ closeMenu(); return; }
    if(cur!=="raw") go("raw"); else go(prev==="raw"||!prev?"g"+lv:prev);
    return;
  }
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var r=sel.r, c=sel.c, moved=true;
  switch(e.key){
    case "ArrowLeft": c--; break; case "ArrowRight": c++; break;
    case "ArrowUp": r--; break; case "ArrowDown": r++; break;
    case "Home": c=0; break; case "End": c=ncols-1; break;
    case "PageDown": r+=20; break; case "PageUp": r-=20; break;
    case "Tab": c+=e.shiftKey?-1:1; break;
    default: moved=false;
  }
  if(moved){ e.preventDefault(); note=null; setSel(r,c); return; }
  var i=gi(sel.r,sel.c);
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(i>=0&&pending===null){ if(cells[i].open) chord(i); else open(i); formula(); }
    else if(i<0) setSel(sel.r+1,sel.c);
  } else if(e.key==="f"||e.key==="F"||e.key==="ㄹ"){ if(i>=0){ e.preventDefault(); mark(i); formula(); } }
  else if(e.key==="h"||e.key==="H"||e.key==="ㅗ"){ e.preventDefault(); if(isVal()) vlHint(); else if(isHeat()) htHint(); else look(); }
  else if(e.key==="F5"||e.key==="r"||e.key==="R"||e.key==="ㄱ"){ if(isGame()||isApple()||isVal()||isHeat()){ e.preventDefault(); restart(); } }
});
function restart(){ if(isApple()) apNew(); else if(isVal()) vlNew(); else if(isHeat()) htNew(); else newBoard(); $("mode").textContent="준비"; render(); sw.focus(); }

$("newBtn").addEventListener("click",function(){ if(isGame()||isApple()||isVal()||isHeat()) restart(); else go("g"+lv); });
$("undoBtn").addEventListener("click",function(){ if(isGame()) restart(); });
$("markBtn").addEventListener("click",function(){ markMode=!markMode; this.classList.toggle("on",markMode); $("mode").textContent=markMode?"검토 표시":"준비"; });
$("tabs").addEventListener("click",function(e){ var t=e.target.closest("[data-go]"); if(t) go(t.dataset.go); });

nbox.addEventListener("focus",function(){ this.select(); });
nbox.addEventListener("keydown",function(e){
  if(e.key!=="Enter") return;
  e.preventDefault();
  var v=this.value.trim();
  if(v.indexOf("XL1")===0){
    var n=takeCode(v);
    if(n<0){ note=null; render(); say('<b>#VALUE!</b> 인식할 수 없는 참조 코드입니다.'); return; }
    if(cur!=="sum") go("sum"); else render();
    say(n?'<b class="ok">반영 완료</b> 실적 '+n+'건이 집계에 추가되었습니다.':'<span class="dim">이미 반영된 실적입니다. 갱신할 내용이 없습니다.</span>');
    return;
  }
  var m=/^([A-Za-z]{1,2})(\d{1,4})$/.exec(v);
  if(m){ var cc=0,s=m[1].toUpperCase(),k; for(k=0;k<s.length;k++) cc=cc*26+(s.charCodeAt(k)-64); setSel(+m[2]-1,cc-1); }
  else nbox.value=A1(sel.r,sel.c);
  sw.focus();
});

function closeMenu(){ $("roleMenu").hidden=true; }
$("roleBtn").addEventListener("click",function(e){ e.stopPropagation(); $("roleMenu").hidden=!$("roleMenu").hidden; });
$("roleMenu").addEventListener("click",function(e){ var b=e.target.closest("[data-role]"); if(!b) return; setRole(+b.dataset.role); closeMenu(); });
document.addEventListener("click",function(){ closeMenu(); });

var rt=null;
window.addEventListener("resize",function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    var nc=Math.ceil(sw.clientWidth/64)+1, nr=Math.ceil(sw.clientHeight/21)+1;
    if(nc>ncols||nr>nrows) render();
  },150);
});

/* 시작 */
newBoard();
setRole(1);
sw.focus();
})();
</script>
</body>
</html>
